# Picos impredecibles con muchos fallos de pago: util para probar reintentos y alertas.
kafka:
  clusterType: LOCAL
  bootstrapServers: ${KAFKA_BOOTSTRAP_SERVERS:-localhost:9092}
  clientId: omnistreamforce-ecommerce

domains:
  - domain: ecommerce
    topic: ecommerce-orders
    errorTopic: ecommerce-errors
    eventsPerSecond: 50
    errorRate: 20
    keyStrategy: ENTITY_ID
    keyField: orderId

generation:
  publishingMode: SPIKE
  durationSeconds: 0

serialization:
  format: JSON

sink:
  type: KAFKA

topic:
  partitions: 3
  replicationFactor: 1
  autoCreate: true
